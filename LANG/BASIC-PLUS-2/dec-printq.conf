# ==============================================================================
# DEC RSTS/E Print Queue Service (PBS Symbiont) Control File
# File: dec-printq.conf
#
# Part of the DEC BASIC-PLUS-2 / RSTS/E Print/Batch Services Subsystem.
# This control file configures daemon behavior, destination mappings,
# burst/banner pages, and queues for local and network printers.
# ==============================================================================

[SERVICE]
# Polling interval in seconds for pending print jobs
poll_interval = 0.5

# Default burst/banner page enablement (1 = ON, 0 = OFF)
banner_default = 1

# ==============================================================================
# Print Queues Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# Network Printer: HP LaserJet M209dw (Direct TCP AppSocket / JetDirect)
# Target Host: NPI0ED18B.local (192.168.40.203:9100)
# ------------------------------------------------------------------------------
[QUEUE:NETPRINT]
description = HP LaserJet M209dw via Direct TCP AppSocket (Port 9100)
status = OPEN
dest_type = SOCKET
dest_path = 192.168.40.203:9100
banner = 1
form_type = NORMAL

# ------------------------------------------------------------------------------
# Network Printer: HP LaserJet M209dw (CUPS Native Host Filter Pipeline)
# Routes through CUPS text-to-rasterizer pipeline for driverless printing
# ------------------------------------------------------------------------------
[QUEUE:HPLASER]
description = HP LaserJet M209dw via CUPS Host Filter
status = OPEN
dest_type = COMMAND
dest_path = lp -d HP_LaserJet_M209dw_0ED18B
banner = 1
form_type = NORMAL

# ------------------------------------------------------------------------------
# System Default Spool Queue
# Jobs spooled to .dcl/spool/SYS_PRINT/
# ------------------------------------------------------------------------------
[QUEUE:SYS$PRINT]
description = Default DEC System Print Spooler
status = OPEN
dest_type = SPOOL
dest_path = 
banner = 1
form_type = NORMAL

# ------------------------------------------------------------------------------
# Physical / Simulated DEC Line Printer Unit 0 (LP0:)
# Direct character stream output
# ------------------------------------------------------------------------------
[QUEUE:LP0:]
description = Simulated DEC LP0: Line Printer Output
status = OPEN
dest_type = FILE
dest_path = .dcl/spool/lp0_simulated.prt
banner = 1
form_type = NORMAL
