services:
  vax-vms:
    build:
      context: .
      dockerfile: Dockerfile
    image: dec-vms:latest
    container_name: dec-vms
    stdin_open: true
    tty: true
    ports:
      - "${VMS_SSH_PORT:-2255}:${VMS_SSH_PORT:-2255}"
      - "${VMS_HTTPS_PORT:-8455}:${VMS_HTTPS_PORT:-8455}"
    volumes:
      - vms_dka0_data:/opt/dec-vms/fs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    env_file:
      - path: ../../.env
        required: false
      - path: .env
        required: false
    environment:
      - DISPLAY=${DISPLAY:-}
      - TERM=${TERM:-vt220}
      - VMS_SSH_PORT=${VMS_SSH_PORT:-2255}
      - VMS_HTTPS_PORT=${VMS_HTTPS_PORT:-8455}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  vms_dka0_data:

networks:
  default:
    name: dec-cluster-net
    external: true
